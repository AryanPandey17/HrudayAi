[project]
name = "cardiovis-backend"
version = "0.1.0"
description = "CAD and vessel stenosis prediction pipeline + API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.142.2",
    "joblib>=1.6.0",
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "pydantic>=2.13.5",
    "scikit-learn>=1.9.1",
    "shap>=0.52.0",
    "uvicorn[standard]>=0.54.0",
    "xgboost>=3.4.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "N", "PTH", "RUF"]
# N803/N806: X / X_train are the conventional names for feature matrices.
ignore = ["N803", "N806"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "jupyter>=1.1.1",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
